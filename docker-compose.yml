services:
  app:
    build: .
    container_name: click-master
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"   # solo localhost; exponer vía reverse proxy si hace falta
    shm_size: "1gb"
    mem_limit: 2g
    env_file:
      - .env
    networks:
      - backend    # para hablar con mysql
      - frontend   # para salir a internet (si la app lo necesita)
    depends_on:
      mysql:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: click-master-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    # SIN "ports:" -> no se expone al host ni a internet
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mysql-tools:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: click-master-mysql-tools
    networks:
      - backend
    stdin_open: true
    tty: true

  mock-api:
    image: nginx:1.27-alpine
    container_name: click-master-mock-api
    ports:
      - "127.0.0.1:${MOCK_API_HOST_PORT:-8080}:80"
    networks:
      - frontend
    volumes:
      - ./docker/mock-api:/usr/share/nginx/html:ro
    restart: unless-stopped

networks:
  backend:
    internal: true   # sin salida a internet ni entrada desde afuera
  frontend:

volumes:
  mysql_data:
