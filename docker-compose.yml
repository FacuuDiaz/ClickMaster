services:
  app:
    build: .
    container_name: click-master
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"   # solo localhost; exponer vía reverse proxy si hace falta
    shm_size: "1gb"
    mem_limit: 2g
    env_file:
      - .env
    networks:
      - backend    # para hablar con mysql
      - frontend   # para salir a internet (si la app lo necesita)
    depends_on:
      mysql:
        condition: service_healthy
      # Solo con el profile "mock" (COMPOSE_PROFILES=mock en .env). Contra la
      # API EDR real no se levanta y la app no lo necesita.
      mock-edr:
        condition: service_started
        required: false
    # Al apagar, el worker devuelve a la cola lo que no empezo y espera las
    # visitas abiertas (hasta LINK_CHECK_TIMEOUT_MS).
    stop_grace_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: click-master-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    # SIN "ports:" -> no se expone al host ni a internet
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mysql-tools:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: click-master-mysql-tools
    networks:
      - backend
    stdin_open: true
    tty: true

  mock-edr:
    image: node:20-alpine
    container_name: click-master-mock-edr
    profiles: ["mock"]
    command: ["node", "/srv/server.js"]
    environment:
      MOCK_EDR_PER_MINUTE: ${MOCK_EDR_PER_MINUTE:-10}
      MOCK_EDR_MAX_ROWS: ${MOCK_EDR_MAX_ROWS:-20000}
      MOCK_EDR_AUTH: ${MOCK_EDR_AUTH:-}
    ports:
      - "127.0.0.1:${MOCK_API_HOST_PORT:-8080}:8080"
    networks:
      - frontend
    volumes:
      - ./docker/mock-edr:/srv:ro
    restart: unless-stopped

networks:
  backend:
    internal: true   # sin salida a internet ni entrada desde afuera
  frontend:

volumes:
  mysql_data:
