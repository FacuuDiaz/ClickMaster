# Entorno LOCAL completo: app + MySQL 8 + API mock.
# Todo corre en containers, no hace falta instalar nada nativo (usar `make up`).
# Para el servidor ver docker-compose.prod.yml.
services:
  app:
    build: .
    container_name: click-master
    ports:
      - "${APP_PORT:-3000}:3000"
    shm_size: "1gb" # Chromium headless necesita mas de los 64MB que da Docker por default
    mem_limit: 2g
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      mock-api:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: click-master-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306" # 3307 en el host para no chocar con otro MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # API falsa que devuelve un JSON de CDRs de ejemplo (docker/mock-api/cdrs.json)
  # y sirve paginas para que los links tengan algo que chequear.
  # Para usar la API real, cambiar API_URL en .env.
  mock-api:
    image: nginx:1.27-alpine
    container_name: click-master-mock-api
    ports:
      - "${MOCK_API_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/mock-api:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  mysql_data:
